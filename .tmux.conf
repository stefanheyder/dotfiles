# Use C-a as prefix and free C-b
set -g prefix C-a
unbind C-b

set-option -g default-command 'zsh'

# Truecolor passthrough: nvim's colorscheme renders in 256 colors without this
set-option -g default-terminal "tmux-256color"
set-option -ga terminal-features ",*:RGB"

# Remove waittime for escape characters
set -s escape-time 1
# Send C-a to application by pressing it twice
bind C-a send-prefix

# enable focus events for vim / tmux focus events 
# and dimming of vim windows
set -g focus-events on 

# Reload configuration file
unbind r
bind r source-file ~/.tmux.conf \; display "Configration file .tmux reloaded!"

# Redefine splitting shortcuts
bind | split-window -h -c "#{pane_current_path}" \; display "Splitting Vertical"
bind - split-window -v -c "#{pane_current_path}" \; display "Splitting Horizontal"
bind c new-window -c "#{pane_current_path}"

# --- gruvbox dark (medium) ----------------------------------------------
# Same palette nvim uses (.config/nvim/lua/plugins.lua) and the same one
# .config/zsh/theme.zsh paints onto the terminal's 16 ANSI slots. Spelled as
# hex here rather than colour0-15 because tmux's own chrome wants the greys
# between bg0 and fg4, which the 16-colour palette has no room for. The
# terminal-features RGB line above is what makes these land exactly.
#
#   bg0 #282828   bg0_h #1d2021  bg1 #3c3836  bg3 #665c54
#   fg1 #ebdbb2   fg4   #a89984  grey #928374
#   yellow #d79921  bright yellow #fabd2f  orange #fe8019

# Inactive panes drop to the harder background, which is what makes the
# active pane read as lit -- the dimming the focus-events line above enables.
setw -g window-style        'fg=#a89984,bg=#1d2021'
setw -g window-active-style 'fg=#ebdbb2,bg=#282828'
set -g pane-border-style        'fg=#3c3836'
set -g pane-active-border-style 'bg=default fg=#928374'

# Status bar
set -g status-style       'fg=#a89984,bg=#3c3836'
set -g status-left-style  'fg=#ebdbb2'
set -g status-right-style 'fg=#a89984'
setw -g window-status-style          'fg=#a89984,bg=#3c3836'
setw -g window-status-current-style  'fg=#282828,bg=#d79921,bold'
setw -g window-status-activity-style 'fg=#fe8019,bg=#3c3836'

# Prompts, copy-mode selection and the pane-number overlay
set -g message-style         'fg=#282828,bg=#d79921'
set -g message-command-style 'fg=#282828,bg=#d79921'
set -g mode-style            'fg=#282828,bg=#fabd2f'
set -g display-panes-colour        '#665c54'
set -g display-panes-active-colour '#d79921'
set -g clock-mode-colour           '#d79921'
# ------------------------------------------------------------------------

# Toggle mouse on
bind m \
    set -g mouse on \;\
    set -g mouse-resize-pane on \;\
    set -g mouse-select-pane on \;\
    set -g mouse-select-window on \;\
    display 'Mouse: ON'

# Toggle mouse off
bind M \
    set -g mouse off \;\
    set -g mouse-resize-pane off \;\
    set -g mouse-select-pane off \;\
    set -g mouse-select-window off \;\
    display 'Mouse: OFF'

# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind-key -n C-h if-shell "$is_vim" "send-keys C-h"  "select-pane -L"
bind-key -n C-j if-shell "$is_vim" "send-keys C-j"  "select-pane -D"
bind-key -n C-k if-shell "$is_vim" "send-keys C-k"  "select-pane -U"
bind-key -n C-l if-shell "$is_vim" "send-keys C-l"  "select-pane -R"
#bind-key -n C-\ if-shell "$is_vim" "send-keys C-\\" "select-pane -l"

bind C-l send-keys 'C-l'

# copy in vi-mode
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel 'xclip -in -selection clipboard'

# Titles (window number, program name, active (or not)
set-option -g set-titles on
set-option -g set-titles-string '#S.#I @ #W'

set-option -g status on
set-option -g status-justify "centre"
set-option -g status-left-length 60
set-option -g status-right-length 90
#set-option -g status-left "#(~/.tmux/tmux-powerline/powerline.sh left)"
#set-option -g status-right "#(~/.tmux/tmux-powerline/powerline.sh right)"
# thyme integration
set-option -g status-right '#(cat ~/.thyme-tmux)'
set-option -g status-interval 1

set-option -g renumber-windows on # renumber windows

#set -g status-utf8 on
#set -g status-bg black
#set -g status-fg white
#set -g status-interval 5
#set -g status-left-length 90
#set -g status-right-length 60
#set -g status-justify left
#set -g status-right '#[fg=blue,bold]#S #[fg=white]%a %d %b %R' 

# do not rename windows
set-option -g allow-rename off

# Start window count at 1
set -g base-index 1

# Plugin Stuff

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
#set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'

#set -g @continuum-restore 'on'


# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"
run '~/.tmux/plugins/tpm/tpm'
